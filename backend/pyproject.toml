[project]
name = "fire-activity-backend"
version = "0.1.0"
description = "Discovery, validation, and one-day exploratory analysis for the extracted NASA FIRMS active-fire archives."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "scipy>=1.14",
    "matplotlib>=3.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
